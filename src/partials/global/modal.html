<div class="backdrop is-hidden" data-modal>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-description">
    <button
      class="button-close modal-button-close js-close-modal"
      type="button"
      aria-label="Закрити">
      <svg class="button-close-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <use href="/icons/sprite.svg#close"></use>
      </svg>
    </button>

    <div class="modal-content">
      <p class="modal-text title">
        LEAVE A REVIEW ABOUT <span class="accent-title">OUR CHOCOLATE</span>
      </p>

      <form class="modal-form">
        <label class="form-label"
          >Name
          <input
            class="form-input"
            type="text"
            name="user-name"
            id="user-name"
            placeholder=" "
            autocomplete="name"
            required />
        </label>
        <svg class="modal-input-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <use href="/icons/sprite.svg#user"></use>
        </svg>

        <label class="form-label"
          >Email
          <input
            class="form-input"
            type="email"
            name="user-email"
            id="user-email"
            placeholder=" "
            autocomplete="email"
            required />
        </label>
        <svg class="modal-input-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <use href="/icons/sprite.svg#email"></use>
        </svg>

        <label class="form-label"
          >Phone number
          <input
            class="form-input"
            type="tel"
            name="user-tel"
            id="user-tel"
            placeholder=" "
            autocomplete="tel"
            required />
        </label>
        <svg class="modal-input-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <use href="/icons/sprite.svg#phone"></use>
        </svg>

        <label class="form-label"
          >Comment
          <textarea
            class="form-input"
            name="user-comment"
            id="user-comment"
            placeholder="Enter text"></textarea>
        </label>

        <input class="modal-input-check" type="checkbox" id="policy-check" />
        <label class="modal-label-check" for="policy-check"></label>
        <p class="policy-text">
          I accept the terms and conditions of the
          <a class="policy-link" href="#">Privacy Policy</a> </p
        ><button class="button modal-submit-btn" type="submit"> Send </button>
      </form>
    </div>
  </div>
</div>
